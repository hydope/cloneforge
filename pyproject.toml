[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloneforge"
version = "0.3.0"
description = "CloneForge — a free, local, open-source voice-cloning meta-engine: it routes across the best free backends and benchmarks them head-to-head on the same line."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "CloneForge contributors" }]
keywords = ["voice-cloning", "tts", "benchmark", "speech", "zero-shot"]
dependencies = []

[project.optional-dependencies]
piper = ["piper-tts>=1.2"]
# the maintained fork: original TTS>=0.22 cannot install on Python 3.12;
# with CPU torch, torchcodec must additionally come from the PyTorch CPU
# index or XTTS's torchaudio.load fails (see docs/INSTALL.md)
yourtts = ["coqui-tts[codec]", "six"]
# av pin: faster-whisper breaks on av>=19 (metadata_errors kwarg removed)
asr = ["faster-whisper>=1.0", "av>=12,<17"]
embed = ["resemblyzer>=0.1"]
# ECAPA scorer: installed into the coqui-tts side venv in practice (it
# reuses that venv's torch — see docs/INSTALL.md); listed here so the
# dependency is declared, not hidden
ecapa = ["speechbrain>=1.0"]
# VoxCPM2 runs from its own side venv (.venv-vox): pip install voxcpm
vox = ["voxcpm>=2.0"]
ui = ["gradio>=4.0"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
cloneforge = "cloneforge.cli:main"

[tool.setuptools.packages.find]
include = ["cloneforge*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
